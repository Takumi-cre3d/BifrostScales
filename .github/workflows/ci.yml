name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - name: Source tests
        run: python -m pytest -q

  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native -B native/build -DBUILD_TESTING=ON -DBIFROST_SCALES_BUILD_BIFROST_OPERATOR=OFF
      - name: Build
        run: cmake --build native/build --config Release --parallel
      - name: Test
        run: ctest --test-dir native/build -C Release --output-on-failure
